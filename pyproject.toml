[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemic-simulation"
version = "0.2.0"
description = "Multi-scale agent-based simulation of viral pandemic spread"
requires-python = ">=3.10"
dependencies = [
    "mesa>=2.3,<3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
dashboard = [
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]
